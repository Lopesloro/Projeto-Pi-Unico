<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PC Builder AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

<div class="login-split">

    <!-- LADO ESQUERDO: Branding -->
    <div class="login-left">
        <div class="left-content">
            <div class="logo-icon">🖥️</div>
            <h1>PC Builder <span class="ai-text">AI</span></h1>
            <p>Monte o PC dos seus sonhos com a ajuda da Inteligência Artificial. Escolha seu orçamento, descreva o uso e deixe a IA fazer o resto!</p>
            <div class="badges">
                <span class="badge">⚡ Rápido</span>
                <span class="badge">🧠 IA Avançada</span>
                <span class="badge">💰 Sob Medida</span>
            </div>
        </div>
    </div>

    <!-- LADO DIREITO: Formulário -->
    <div class="login-right">
        <div class="form-container">
            <h2>Bem-vindo de volta</h2>
            <p class="subtitle">Entre para montar o setup dos seus sonhos</p>

            <form id="login-form">

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <span>📧</span>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <span>🔒</span>
                        <input type="password" id="senha" placeholder="Sua senha" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">➔ Entrar</button>

            </form>

            <div class="login-links">
                <a href="#" class="link-forgot">Esqueceu a senha?</a>
                <a href="#" class="link-register">Criar conta</a>
            </div>
        </div>
    </div>

</div>

<!-- JS de Login (conecta ao backend) -->
<script src="js/login.js"></script>

</body>
</html>
