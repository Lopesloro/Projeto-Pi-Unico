<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder AI — Monte o PC dos seus Sonhos</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ================================================
           INTRO SCREEN
        ================================================ */
        #intro-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        #intro-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #fff;
            min-height: 1.2em;
        }

        #intro-title .ai-glow {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #intro-cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: #00d4ff;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.7s step-end infinite;
        }

        #intro-sub {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.9rem, 2.5vw, 1.15rem);
            color: #64748b;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #intro-sub.visible { opacity: 1; }

        #intro-bar {
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            border-radius: 2px;
            transition: width 1s ease;
            max-width: 320px;
        }

        #intro-screen.fade-out {
            opacity: 0;
            transition: opacity 0.7s ease;
            pointer-events: none;
        }

        /* ================================================
           LANDING PAGE RESET (body default já cuida do bg)
        ================================================ */
        body.landing-page {
            padding: 0;
            align-items: stretch;
            overflow-x: hidden;
        }

        /* ================================================
           NAVBAR
        ================================================ */
        .land-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2.5rem;
            background: rgba(7, 8, 16, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.07);
            transition: all 0.3s;
        }

        .land-nav.scrolled {
            padding: 0.75rem 2.5rem;
            background: rgba(7, 8, 16, 0.97);
        }

        .land-nav-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.01em;
        }

        .brand-icon {
            font-size: 1.4rem;
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.4));
        }

        .land-nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .land-nav-links a {
            color: var(--text-2);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: var(--transition);
            letter-spacing: 0.01em;
        }

        .land-nav-links a:hover { color: var(--text); }

        .land-nav-actions {
            display: flex;
            align-items: center;
            gap: 0.625rem;
        }

        .btn-ghost-nav {
            background: transparent;
            border: 1px solid rgba(0, 212, 255, 0.18);
            color: var(--text-2);
            padding: 0.5rem 1.125rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-ghost-nav:hover {
            background: rgba(0, 212, 255, 0.06);
            border-color: rgba(0, 212, 255, 0.35);
            color: var(--text);
        }

        .btn-primary-nav {
            background: var(--gradient);
            border: none;
            color: #fff;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--spring);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.2);
        }

        .btn-primary-nav:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }

        /* ================================================
           HERO SECTION
        ================================================ */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 6rem 2.5rem 4rem;
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            width: 100%;
        }

        /* ---- LEFT COLUMN ---- */
        .hero-text { display: flex; flex-direction: column; align-items: flex-start; }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(0, 212, 255, 0.06);
            border: 1px solid rgba(0, 212, 255, 0.18);
            color: var(--cyan);
            padding: 0.4rem 0.875rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.04em;
            margin-bottom: 1.5rem;
            animation: fadeInDown 0.6s ease both;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.6rem, 5vw, 3.75rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            color: var(--text);
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.6s ease 0.1s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-desc {
            font-size: 1.05rem;
            color: var(--text-2);
            line-height: 1.75;
            margin-bottom: 2.25rem;
            max-width: 480px;
            animation: fadeInUp 0.6s ease 0.2s both;
        }

        .hero-ctas {
            display: flex;
            gap: 0.875rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
            animation: fadeInUp 0.6s ease 0.3s both;
        }

        .btn-hero-primary {
            background: var(--gradient);
            border: none;
            color: #fff;
            padding: 0.875rem 1.875rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--spring);
            box-shadow: 0 4px 24px rgba(0, 212, 255, 0.25), 0 2px 8px rgba(124, 58, 237, 0.2);
            letter-spacing: 0.01em;
        }

        .btn-hero-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.35), 0 4px 16px rgba(124, 58, 237, 0.3);
        }

        .btn-hero-ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-2);
            padding: 0.875rem 1.875rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-hero-ghost:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 212, 255, 0.3);
            color: var(--text);
        }

        /* ---- STATS ROW ---- */
        .hero-stats {
            display: flex;
            align-items: center;
            gap: 0;
            animation: fadeInUp 0.6s ease 0.4s both;
        }

        .stat-item { display: flex; flex-direction: column; gap: 0.2rem; padding: 0 1.5rem; }
        .stat-item:first-child { padding-left: 0; }

        .stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.04em;
        }

        .stat-sep {
            width: 1px;
            height: 36px;
            background: rgba(0, 212, 255, 0.12);
        }

        /* ---- RIGHT COLUMN (APP MOCKUP) ---- */
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInRight 0.7s ease 0.2s both;
        }

        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(24px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .app-mockup {
            width: 100%;
            max-width: 480px;
            background: rgba(13, 17, 35, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.12);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 212, 255, 0.05), 0 0 60px rgba(0, 212, 255, 0.06);
            position: relative;
        }

        /* Detalhe de canto */
        .app-mockup::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 40px; height: 40px;
            border-top: 2px solid rgba(0, 212, 255, 0.4);
            border-left: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 20px 0 0 0;
        }

        .app-mockup::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 40px; height: 40px;
            border-bottom: 2px solid rgba(124, 58, 237, 0.4);
            border-right: 2px solid rgba(124, 58, 237, 0.4);
            border-radius: 0 0 20px 0;
        }

        .mockup-bar {
            background: rgba(7, 8, 16, 0.8);
            border-bottom: 1px solid rgba(0, 212, 255, 0.07);
            padding: 0.875rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mockup-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
        }

        .md-red    { background: #ff5f57; }
        .md-yellow { background: #febc2e; }
        .md-green  { background: #28c840; }

        .mockup-title {
            flex: 1;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-right: 1rem;
        }

        .mockup-body { padding: 1.75rem 1.5rem 2rem; }

        .mk-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .mk-brand-icon {
            font-size: 1.1rem;
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 212, 255, 0.07);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 8px;
        }

        .mk-brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
        }

        .mk-brand-name span {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mk-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .mk-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 1.25rem;
        }

        /* Steps mini */
        .mk-steps {
            display: flex;
            align-items: center;
            gap: 0;
            margin-bottom: 1.5rem;
        }

        .mk-step-dot {
            display: flex; flex-direction: column; align-items: center; gap: 0.25rem; flex: 1;
        }

        .mk-step-circle {
            width: 22px; height: 22px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; font-weight: 700;
            border: 2px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .mk-step-circle.done {
            border-color: #00ff88;
            background: rgba(0,255,136,0.1);
            color: #00ff88;
        }

        .mk-step-circle.active {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.1);
            color: #00d4ff;
            box-shadow: 0 0 8px rgba(0,212,255,0.25);
        }

        .mk-step-line {
            flex: 2; height: 1px;
            background: rgba(255,255,255,0.05);
            margin-bottom: 1rem;
        }

        .mk-step-line.done { background: #00ff88; }

        .mk-label-row {
            display: flex;
            margin-bottom: 0.5rem;
        }

        .mk-label {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .mk-input-fake {
            background: rgba(7, 8, 16, 0.8);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 7px;
            padding: 0.6rem 0.875rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--text);
            margin-bottom: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mk-input-fake .mk-prefix {
            color: var(--cyan);
            font-weight: 700;
        }

        .mk-input-fake .mk-val {
            color: var(--text);
        }

        .mk-hints {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            margin-bottom: 1.25rem;
        }

        .mk-hint {
            background: rgba(0, 212, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.08);
            border-radius: 6px;
            padding: 0.45rem 0.625rem;
            text-align: center;
        }

        .mk-hint-val {
            display: block;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
        }

        .mk-hint-label {
            display: block;
            font-size: 0.6rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.04em;
        }

        /* AI generating animation */
        .mk-ai-bar {
            background: var(--gradient);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        .mk-ai-spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .mk-ai-dots::after {
            content: '';
            animation: dots 1.5s steps(3) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            33%  { content: '.'; }
            66%  { content: '..'; }
            100% { content: '...'; }
        }

        /* Glow effect behind mockup */
        .mockup-glow {
            position: absolute;
            inset: -60px;
            background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(0, 212, 255, 0.07), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* Floating chips around mockup */
        .mockup-chip {
            position: absolute;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.12);
            border-radius: 10px;
            padding: 0.5rem 0.75rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-2);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        .mc-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            animation: blink 2s infinite;
        }

        .chip-tl {
            top: 15%; left: -8rem;
            animation: floatA 5s ease-in-out infinite;
        }

        .chip-br {
            bottom: 12%; right: -8rem;
            animation: floatB 6s ease-in-out infinite 1s;
        }

        .chip-tr {
            top: 40%; right: -9rem;
            animation: floatA 7s ease-in-out infinite 0.5s;
        }

        /* ================================================
           MODALS (login / cadastro)
        ================================================ */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--bg-3);
            border: 1px solid rgba(0, 212, 255, 0.12);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 212, 255, 0.05);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        .modal-box h2 {
            text-align: center;
            margin-bottom: 0.4rem;
            font-size: 1.5rem;
            font-family: 'Space Grotesk', sans-serif;
        }

        .modal-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 2rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .modal-close {
            position: absolute;
            top: 1rem; right: 1rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-muted);
            width: 30px; height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--text);
            background: rgba(255,255,255,0.1);
            border-color: rgba(0, 212, 255, 0.2);
        }

        /* msg */
        #msg-login, #msg-cadastro {
            font-size: 0.78rem;
            font-weight: 500;
            text-align: center;
            min-height: 1em;
            margin-top: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* toast */
        .toast {
            position: fixed;
            bottom: 2rem; right: 2rem;
            padding: 0.875rem 1.25rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 300;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid;
            backdrop-filter: blur(12px);
            font-family: 'JetBrains Mono', monospace;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-ok  { background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.2); color: var(--green); }
        .toast-err { background: rgba(255,68,102,0.08); border-color: rgba(255,68,102,0.2); color: var(--red); }

        /* ================================================
           RESPONSIVIDADE
        ================================================ */
        @media (max-width: 900px) {
            .hero-content {
                grid-template-columns: 1fr;
                gap: 3rem;
                text-align: center;
            }

            .hero-text { align-items: center; }
            .hero-desc { margin-left: auto; margin-right: auto; }

            .chip-tl, .chip-br, .chip-tr { display: none; }

            .land-nav-links { display: none; }
        }

        @media (max-width: 600px) {
            .land-nav { padding: 1rem 1.25rem; }
            .hero { padding: 5rem 1.25rem 3rem; }
            .hero-h1 { font-size: 2.2rem; }
            .hero-ctas { flex-direction: column; width: 100%; }
            .btn-hero-primary, .btn-hero-ghost { width: 100%; justify-content: center; }
            .hero-stats { flex-wrap: wrap; gap: 1.25rem; }
            .stat-sep { display: none; }
            .stat-item { padding: 0; }
        }
    </style>
</head>
<body class="landing-page">

<!-- ================================================
     INTRO SCREEN
</body>
</html>
